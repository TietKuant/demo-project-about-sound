[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-denoise-demo"
version = "0.1.0"
description = "Minimal architecture-first dry-run scaffold for an offline audio/video denoise demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "noisereduce",
    "soundfile",
]

[project.scripts]
offline-denoise-demo = "src.pipeline.run_pipeline:main"
